site_name: My MkDocs Site
site_description: 一个演示用的MkDocs站点
site_author: Trae AI

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml

nav:
  - 首页: index.md
  - 关于: about.md
  - 文档:
    - 使用指南: docs/usage.md
  - 博客:
    - 第一篇文章: blog/first-post.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - extra
